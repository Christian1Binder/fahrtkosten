<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07131e"><title>Kalender & Auswertungen</title><style>:root{--bg:#07131e;--panel:#0e1d29;--line:#2d4152;--text:#eef3f7;--muted:#93a3b2;--accent:#b8c46f}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}.layout{height:100%;display:grid;grid-template-columns:230px 1fr}.side{background:#08141f;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.15rem;margin:8px 4px 28px}.mark{font-size:1.8rem;color:var(--accent)}.side nav{display:grid;gap:8px}.side a,.side button{border:0;background:transparent;color:var(--muted);text-decoration:none;text-align:left;padding:13px 14px;border-radius:12px;font-weight:800;cursor:pointer}.side a:hover,.side button:hover,.side .active{background:#aab66c18;color:#cbd77a;box-shadow:inset 0 0 0 1px #65713f}.bottom{margin-top:auto;display:grid;gap:8px}.content{min-width:0;display:grid;grid-template-rows:66px 1fr}.bar{background:#0b1823;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}.title{font-weight:900;font-size:1.05rem}.sub{font-size:.73rem;color:var(--muted);margin-top:2px}.actions{display:flex;gap:8px}.actions a{color:var(--text);background:#172a39;border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-decoration:none;font-weight:800}.actions .primary{background:var(--accent);color:#111710;border-color:var(--accent)}iframe{display:block;width:100%;height:100%;border:0;background:#07131e}.mobilebar{display:none}@media(max-width:900px){.layout{display:block}.side{display:none}.content{height:100%;grid-template-rows:60px 1fr}.bar{padding:8px 10px}.actions a{padding:8px 10px;font-size:.75rem}.title{font-size:.9rem}.sub{display:none}.mobilebar{display:flex;position:fixed;z-index:20;left:0;right:0;bottom:0;background:#07131ef2;border-top:1px solid var(--line);padding:7px 8px max(7px,env(safe-area-inset-bottom));grid-template-columns:repeat(4,1fr)}.mobilebar a{display:grid;place-items:center;gap:3px;color:var(--muted);text-decoration:none;font-size:.65rem;font-weight:800;padding:6px}.mobilebar .active{color:var(--accent)}iframe{padding-bottom:66px}}</style></head><body><div class="layout"><aside class="side"><div class="brand"><span class="mark">⬡</span>Dienstjournal</div><nav><a href="mobile.html">⌂ Übersicht</a><button class="active" data-tab="calpanel">▦ Kalender</button><button data-tab="timelinePanel">≡ Zeitleiste</button><button data-tab="coursesPanel">◇ Lehrgänge</button><button data-tab="exercisePanel">⬡ FvD & Übung</button><button data-tab="taxPanel">▥ Auswertungen</button><a href="help.html">? Hilfe</a></nav><div class="bottom"><a href="mobile.html">← Schnellansicht</a></div></aside><main class="content"><header class="bar"><div><div class="title">Kalender & Auswertungen</div><div class="sub">Vollständige Verwaltung des Dienstjournals</div></div><div class="actions"><a class="primary" href="mobile.html">Schnellansicht</a><a href="help.html">Hilfe</a></div></header><iframe id="app" src="index.html" title="Dienstjournal Vollansicht"></iframe></main></div><nav class="mobilebar"><a href="mobile.html"><span>⌂</span>Übersicht</a><a class="active" href="calendar.html"><span>▦</span>Kalender</a><a href="calendar.html#taxPanel"><span>▥</span>Auswertung</a><a href="help.html"><span>?</span>Hilfe</a></nav><script>const frame=document.getElementById('app');const dark=`:root{--bg:#07131e!important;--text:#eef3f7!important;--muted:#93a3b2!important;--border:#2d4152!important;--blue:#b8c46f!important;--shadow:0 14px 36px #0004!important}html{background:#07131e!important}body{background:radial-gradient(circle at 80% 0,#10283b 0,#07131e 46%,#06111a 100%)!important;color:var(--text)!important}.app{max-width:1400px!important;padding:20px 16px 80px!important}.card,.calendar,.side,.section{background:linear-gradient(145deg,#112333,#0e1b27)!important;border-color:var(--border)!important;box-shadow:var(--shadow)!important}.account{background:#0d1b27!important}.tabs{background:#0c1924!important;border-color:var(--border)!important}.tab{color:var(--muted)!important}.tab.active{background:#b8c46f!important;color:#10160d!important}.stat{background:linear-gradient(145deg,#132536,#0d1a26)!important}.stat b{color:#d9e397!important}.toolbar,.modebar,.palette,.cleanpanel,.dragopts{background:#0c1924!important;border-color:var(--border)!important}.toolbar button,.toolbar select,.modebtn,.toolgroup,.field input,.field select,.field textarea,.dragopts select{background:#0a1721!important;color:var(--text)!important;border-color:var(--border)!important}.modebtn{color:var(--muted)!important}.modebtn.active{background:#b8c46f!important;color:#111710!important;border-color:#c4d077!important}.toolgroup{background:#101f2c!important}.tool{background:#162736!important;color:#dce5eb!important;border-color:#31485b!important}.tool.active{border-color:#b8c46f!important;box-shadow:0 0 0 3px #b8c46f26!important}.day{background:#0b1823!important;border-color:#2b4051!important;color:var(--text)!important}.day.empty{background:transparent!important}.day.pick{background:#27331f!important;box-shadow:inset 0 0 0 3px #b8c46f99!important}.day.today{box-shadow:inset 0 0 0 2px #b8c46f!important}.chip{border:1px solid #415465!important;background:#172a39!important;color:#eef3f7!important}.entry,.course,.tl,.taxcards .stat,.exday,.dayitem,.cleanchoice{background:#0c1924!important;border-color:var(--border)!important}.mini,.hint,.clean-summary{background:#0a1721!important}.dark{background:#b8c46f!important;color:#10160d!important}.light{background:#21303c!important;color:#eef3f7!important}.danger{background:#48252a!important;color:#ffd6d9!important}.modal,.login{background:#10202e!important;color:var(--text)!important}.table th,.table td{border-color:#263a4a!important}.week{color:#93a3b2!important}@media(max-width:640px){.app{padding:12px 8px 90px!important}.head{align-items:flex-start!important}.summary{grid-template-columns:repeat(2,1fr)!important}}`;function selectTab(id){try{const d=frame.contentDocument,t=d.querySelector('.tab[data-tab="'+id+'"]');if(t)t.click()}catch(e){}}frame.addEventListener('load',()=>{try{const d=frame.contentDocument,s=d.createElement('style');s.textContent=dark;d.head.appendChild(s);const hash=location.hash.slice(1);if(hash)selectTab(hash);const p=new URLSearchParams(location.search),edit=p.get('edit');if(edit){setTimeout(()=>{const el=d.querySelector('[data-entry="'+CSS.escape(edit)+'"]');if(el)el.click()},500)}}catch(e){}});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));selectTab(b.dataset.tab)});addEventListener('hashchange',()=>selectTab(location.hash.slice(1)));</script></body></html>
