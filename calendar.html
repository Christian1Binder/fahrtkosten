const host=document.getElementById('host'),state=document.getElementById('loadState');let frame=null;
const oldListener="unsub=onSnapshot(col(),s=>{E=[];s.forEach(d=>{let v=d.data();if(d.id==='_journal'){if(Array.isArray(v.entries))E=v.entries;if(v.distance!=null)dist=+v.distance||75}});$('stext').textContent='Synchronisiert';render()},e=>{$('stext').textContent='Synchronisationsfehler';err(e.message)})";
const newListener="unsub=onSnapshot(ref(),s=>{let v=s.data()||{};E=Array.isArray(v.entries)?v.entries:[];if(v.distance!=null)dist=+v.distance||75;$('stext').textContent=E.length+' Einträge · synchronisiert';render()},e=>{$('stext').textContent='Synchronisationsfehler';err(e.message)})";
function patchVacation(html){
 const field='<div class="field full"><label>Bezeichnung / Lehrgangsort</label><input id="title"></div>';
 html=html.replace(field,field+'<div class="field" id="vacationDaysWrap"><label>Tatsächlich benötigte Urlaubstage</label><input id="vacationDays" type="number" min="0" step="0.5"><small class="muted">Wochenenden und Feiertage selbst herausrechnen.</small></div>');
 html=html.replace("$('weekdaywrap').style.display=t.startsWith('s6')?'flex':'none';","$('weekdaywrap').style.display=t.startsWith('s6')?'flex':'none';$('vacationDaysWrap').style.display=t==='urlaub'?'flex':'none';");
 html=html.replace("t==='uebung'?'Übungsplatz danach tageweise für den FvD-Aufbau klassifizieren.':'Zeitraum oder einzelnen Tag speichern.'","t==='uebung'?'Übungsplatz danach tageweise für den FvD-Aufbau klassifizieren.':t==='urlaub'?'Urlaubszeitraum und tatsächlich benötigte Urlaubstage getrennt erfassen.':'Zeitraum oder einzelnen Tag speichern.'");
 html=html.replace("$('courseDistance').value=e.distance??'';fillCourses();","$('courseDistance').value=e.distance??'';$('vacationDays').value=e.vacationDays??'';fillCourses();");
 html=html.replace("let title=$('title').value.trim(),note=$('note').value.trim(),existing=editingId?E.find(x=>x.id===editingId):null;","let title=$('title').value.trim(),note=$('note').value.trim(),vacationDays=$('vacationDays').value===''?undefined:+$('vacationDays').value,existing=editingId?E.find(x=>x.id===editingId):null;if(t==='urlaub'&&(vacationDays===undefined||vacationDays<0))throw Error('Bitte die tatsächlich benötigten Urlaubstage eintragen.');");
 html=html.replace("dayTypes:t==='uebung'?(existing.dayTypes||{}):undefined,km:undefined,courseId:undefined,tripKind:undefined,manualClass:undefined","dayTypes:t==='uebung'?(existing.dayTypes||{}):undefined,vacationDays:t==='urlaub'?vacationDays:undefined,km:undefined,courseId:undefined,tripKind:undefined,manualClass:undefined");
 html=html.replace("note,dayTypes:t==='uebung'?{}:undefined}));await store();['title','km','courseDistance','note']","note,dayTypes:t==='uebung'?{}:undefined,vacationDays:t==='urlaub'?vacationDays:undefined}));await store();['title','km','courseDistance','note','vacationDays']");
 html=html.replace("else E.push(clean({id:Date.now(),type:tool,from:a,to:b,title:'',note:'',dayTypes:tool==='uebung'?{}:undefined}));","else if(tool==='urlaub'){let vacationDays=Number(prompt('Wie viele Urlaubstage werden für diesen Zeitraum tatsächlich benötigt? Wochenenden und Feiertage bitte selbst herausrechnen.',''));if(!Number.isFinite(vacationDays)||vacationDays<0)throw Error('Urlaub wurde nicht gespeichert: gültige Urlaubstage fehlen.');E.push(clean({id:Date.now(),type:tool,from:a,to:b,title:'',note:'',vacationDays}))}else E.push(clean({id:Date.now(),type:tool,from:a,to:b,title:'',note:'',dayTypes:tool==='uebung'?{}:undefined}));");
 html=html.replace("u=0,l=0,p=0;for(let m=0;m<12;m++)for(let d=1;d<=new Date(2026,m+1,0).getDate();d++){let x=new Date(2026,m,d);if(E.some(e=>e.type==='urlaub'&&inside(e,x)))u++;if(E.some(e=>e.type==='lehrgang'&&inside(e,x)))l++;","u=E.filter(e=>e.type==='urlaub').reduce((sum,e)=>sum+(e.vacationDays!=null?+e.vacationDays||0:days(parse(e.from),parse(e.to||e.from))),0),l=0,p=0;for(let m=0;m<12;m++)for(let d=1;d<=new Date(2026,m+1,0).getDate();d++){let x=new Date(2026,m,d);if(E.some(e=>e.type==='lehrgang'&&inside(e,x)))l++;");
 html=html.replace("${e.km?' · '+e.km+' km':''}</p>","${e.km?' · '+e.km+' km':''}${e.type==='urlaub'&&e.vacationDays!=null?' · '+e.vacationDays+' Urlaubstage':''}</p>");
 html=html.replace("['Von','Bis','Art','Lehrgang/Ort','Fahrtart','Kilometer','Notiz']","['Von','Bis','Art','Lehrgang/Ort','Fahrtart','Kilometer','Urlaubstage','Notiz']");
 html=html.replace("e.tripKind||'',e.km||'',e.note||''","e.tripKind||'',e.km||'',e.vacationDays??'',e.note||''");
 return html;
}
function selectTab(id){try{const d=frame.contentDocument,t=d.querySelector('.tab[data-tab="'+id+'"]');if(t)t.click()}catch(e){}}
async function start(){try{let html=await fetch('index.html?v=20260731-7',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('index.html konnte nicht geladen werden');return r.text()});if(!html.includes(oldListener))throw Error('Die erwartete Datenladefunktion wurde nicht gefunden.');html=html.replace(oldListener,newListener).replace("inside=(e,d)=>d>=parse(e.from)&&d<=parse(e.to)","inside=(e,d)=>{if(!e?.from)return false;let x=iso(d),to=e.to||e.from;return x>=e.from&&x<=to&&!(Array.isArray(e.excludedDays)&&e.excludedDays.includes(x))}");html=html.replace("initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,onSnapshot,serverTimestamp","getFirestore,collection,doc,setDoc,onSnapshot,serverTimestamp").replace("db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})","db=getFirestore(app)");html=patchVacation(html);frame=document.createElement('iframe');frame.id='app';frame.title='Dienstjournal Vollansicht';host.replaceWith(frame);frame.addEventListener('load',()=>{try{const d=frame.contentDocument,l=d.createElement('link');l.rel='stylesheet';l.href=new URL('desktop-theme.css?v=20260731-7',location.href).href;l.dataset.retroTheme='1';d.head.appendChild(l);state.textContent='Direkte Serversynchronisation · Urlaubstage manuell';const hash=location.hash.slice(1);if(hash)selectTab(hash);const edit=new URLSearchParams(location.search).get('edit');if(edit)setTimeout(()=>{const el=d.querySelector('[data-entry="'+CSS.escape(edit)+'"]');if(el){el.scrollIntoView({block:'center'});el.click()}},600)}catch(e){state.textContent='Darstellungsfehler'}});frame.srcdoc=html}catch(e){host.textContent='Kalender konnte nicht gestartet werden: '+e.message;state.textContent='Ladefehler'}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));selectTab(b.dataset.tab)});addEventListener('hashchange',()=>selectTab(location.hash.slice(1)));start();
</script></body></html>
