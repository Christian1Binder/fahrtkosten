<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Dienstjournal mobil</title><style>:root{--bg:#eef1f5;--text:#172033;--muted:#667085;--border:#d6dde8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.app{max-width:760px;margin:auto;padding:14px 12px 40px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px}.head h1{margin:0;font-size:1.6rem}.date,.muted{color:var(--muted);font-size:.8rem}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:850;cursor:pointer}.dark{background:#111827;color:#fff}.light{background:#e5e7eb;color:#111827}.card{background:#fff;border:1px solid var(--border);border-radius:19px;padding:14px;box-shadow:0 10px 30px #17203312}.today{margin-bottom:14px}.today h2{margin:0 0 9px;font-size:1rem}.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{border:0;border-radius:999px;padding:7px 10px;background:#f1f5f9;font-size:.73rem;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick{min-height:112px;border:0;border-radius:19px;padding:14px;text-align:left;font-size:1rem;font-weight:900;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 30px #17203312}.quick span{font-size:1.6rem}.quick small{font-size:.68rem;font-weight:700;opacity:.82}.drive{background:#dcfce7;color:#166534}.course{background:#ede9fe;color:#5b21b6}.duty{background:#fef3c7;color:#92400e}.absence{background:#ffe4e6;color:#9f1239}.health{background:#fee2e2;color:#991b1b}.fvd{background:#dbeafe;color:#1d4ed8}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.bottom .btn{min-height:50px}.sheetback{position:fixed;inset:0;background:#11182799;display:grid;place-items:end center;padding:12px;z-index:40}.sheetback[hidden]{display:none}.sheet{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:23px 23px 14px 14px;padding:17px}.sheethead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.sheethead h2{margin:0;font-size:1.15rem}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions .btn{min-height:54px}.form{display:grid;gap:10px}.field{display:grid;gap:5px}.field label{font-size:.73rem;color:var(--muted);font-weight:750}.field input,.field select{width:100%;min-height:49px;border:1px solid var(--border);border-radius:11px;padding:10px;background:#fff}.login{position:fixed;inset:0;background:#111827cc;display:grid;place-items:center;padding:18px;z-index:80}.login[hidden]{display:none}.loginbox{max-width:390px;background:#fff;border-radius:20px;padding:22px;text-align:center}.loginbox .btn{width:100%;min-height:52px}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;background:#111827;color:#fff;border-radius:999px;padding:10px 15px;transition:.2s;z-index:90}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}.quick{min-height:104px;padding:12px}.quick small{font-size:.63rem}}</style></head><body><main class="app"><header class="head"><div><h1>Dienstjournal</h1><div id="date" class="date"></div></div><button id="logout" class="btn light">Abmelden</button></header><section class="card today"><h2>Heute erfasst</h2><div id="today" class="pills"><span class="muted">Lädt …</span></div></section><section class="grid"><button class="quick drive" data-q="drive"><span>🚗</span>Heute gefahren<small>§ 6 Hin, Rück oder beides</small></button><button class="quick course" data-q="course"><span>🎓</span>Lehrgang<small>§ 3 Fahrt oder HomO</small></button><button class="quick duty" data-q="duty"><span>🏕️</span>Übung / Dienst<small>Übungsplatz, Reise, Sonderdienst</small></button><button class="quick absence" data-q="absence"><span>🏖️</span>Abwesenheit<small>Urlaub oder Sonderurlaub</small></button><button class="quick health" data-q="health"><span>❤️</span>Gesundheit<small>KZH, BWK oder Krankenfahrt</small></button><button class="quick fvd" data-q="fvd"><span>🕒</span>FvD heute<small>Genommenen FvD eintragen</small></button></section><div class="bottom"><button id="period" class="btn light">Zeitraum erfassen</button><a class="btn dark" style="text-align:center;text-decoration:none" href="./">Kalender & Auswertungen</a></div></main><div id="sheetback" class="sheetback" hidden><section class="sheet"><div class="sheethead"><h2 id="title">Schnellerfassung</h2><button id="close" class="btn light">Schließen</button></div><div id="body"></div></section></div><div id="login" class="login"><div class="loginbox"><h2>Dienstjournal öffnen</h2><p class="muted">Mit demselben Google-Konto anmelden wie in der Vollansicht.</p><button id="signin" class="btn dark">Mit Google anmelden</button></div></div><div id="toast" class="toast">Gespeichert</div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';import{initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';const cfg={apiKey:'AIzaSyCmkI1PxYkj5yXJ2k-GBd4zwQ1Hw1K3H1w',authDomain:'bw-fahrtkostenapp.firebaseapp.com',projectId:'bw-fahrtkostenapp',storageBucket:'bw-fahrtkostenapp.firebasestorage.app',messagingSenderId:'806301754050',appId:'1:806301754050:web:c9c2531613c3927cae515b'},app=initializeApp(cfg),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}),provider=new GoogleAuthProvider(),$=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=s=>{let[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'),clean=o=>Object.fromEntries(Object.entries(o).filter(([,v])=>v!==undefined));provider.setCustomParameters({prompt:'select_account'});let user=null,E=[],dist=75,unsub=null;const col=()=>collection(db,'users',user.uid,'days'),jdoc=()=>doc(db,'users',user.uid,'days','_journal'),courses=()=>E.filter(e=>e.type==='lehrgang'),inside=(e,d)=>d>=parse(e.from)&&d<=parse(e.to),label=t=>({s6hin:'§ 6 Hinfahrt',s6rueck:'§ 6 Rückfahrt',s6beide:'§ 6 Hin & zurück',urlaub:'Urlaub',sonderurlaub:'Sonderurlaub',lehrgang:'Lehrgang § 3',fahrt:'§ 3 Fahrt',homo:'Lehrgang HomO',uebung:'Übungsplatz',dienstreise:'Dienstreise',sonder:'Sonderdienst',kzh:'KZH',bwk:'BWK',krankenfahrt:'Krankenfahrt',familienheimfahrt:'Familienheimfahrt',fvd:'FvD genommen'})[t]||t;function toast(){let x=$('toast');x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}async function store(){await setDoc(jdoc(),{entries:E.map(clean),distance:dist,updatedAt:serverTimestamp()});toast()}function render(){let now=new Date(),today=iso(now);$('date').textContent=now.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});let a=E.filter(e=>inside(e,now)||(e.type==='fahrt'&&e.from===today));$('today').innerHTML=a.length?a.map(e=>`<span class="pill">${esc(label(e.type))}${e.title?' · '+esc(e.title):''}</span>`).join(''):'<span class="muted">Noch keine Einträge.</span>'}function open(title,html){$('title').textContent=title;$('body').innerHTML=html;$('sheetback').hidden=false}function close(){$('sheetback').hidden=true;$('body').innerHTML=''}function conflict(type,from,to){let s=new Set(['urlaub','sonderurlaub','lehrgang','uebung','sonder','dienstreise','kzh','bwk']);return s.has(type)&&E.some(e=>e.type!==type&&s.has(e.type)&&!(e.to<from||e.from>to))}async function add(type,from=iso(new Date()),to=from,x={}){if(conflict(type,from,to)&&!confirm('Es besteht bereits ein anderer Dienststatus. Trotzdem zusätzlich speichern?'))return;E.push(clean({id:Date.now(),type,from,to,title:x.title||'',km:x.km,courseId:x.courseId,tripKind:x.tripKind,note:'',dayTypes:type==='uebung'?{}:undefined}));await store();render();close()}function drive(){open('Heute gefahren',`<div class="actions"><button class="btn drive" data-d="s6beide">Hin & zurück</button><button class="btn drive" data-d="s6hin">Nur Hinfahrt</button><button class="btn drive" data-d="s6rueck">Nur Rückfahrt</button><button class="btn light" data-d="familienheimfahrt">Familienheimfahrt</button></div>`);document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let t=b.dataset.d;if(t==='familienheimfahrt')return kmform(t,'Familienheimfahrt');add(t,undefined,undefined,{km:dist*(t==='s6beide'?2:1)})})}function kmform(type,title){open(title,`<div class="form"><div class="field"><label>Kilometer</label><input id="km" type="number" min="0" step="0.1"></div><button id="kms" class="btn dark">Heute speichern</button></div>`);$('kms').onclick=()=>add(type,undefined,undefined,{km:+$('km').value||0})}function course(){let c=courses();if(!c.length){open('Lehrgang','<p class="muted">Noch kein Lehrgang angelegt. Bitte zunächst in der Vollansicht einen Lehrgang mit Ort und Entfernung anlegen.</p><a class="btn dark" style="display:block;text-align:center;text-decoration:none" href="./">Vollansicht öffnen</a>');return}open('Lehrgang heute',`<div class="form"><div class="field"><label>Lehrgang</label><select id="c">${c.map(x=>`<option value="${x.id}">${esc(x.title||'Lehrgang')}</option>`).join('')}</select></div><div class="actions"><button class="btn course" data-c="anreise">Anreise</button><button class="btn course" data-c="heimfahrt">Heimfahrt</button><button class="btn course" data-c="rueckreise">Rückreise</button><button class="btn course" data-c="homo">HomO heute</button></div></div>`);document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{let x=c.find(z=>+z.id===+$('c').value),k=b.dataset.c;if(k==='homo')add('homo',undefined,undefined,{courseId:x.id,title:x.title});else add('fahrt',undefined,undefined,{courseId:x.id,tripKind:k,km:(+x.distance||0)*(k==='heimfahrt'?2:1),title:x.title})})}function duty(){open('Übung / Dienst',`<div class="actions"><button class="btn duty" data-x="uebung">Übungsplatz</button><button class="btn duty" data-x="dienstreise">Dienstreise</button><button class="btn duty" data-x="sonder">Sonderdienst heute</button><button id="dp" class="btn light">Zeitraum</button></div>`);document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>b.dataset.x==='sonder'?add('sonder'):period(b.dataset.x));$('dp').onclick=()=>period('uebung')}function absence(){open('Abwesenheit',`<div class="actions"><button class="btn absence" data-a="urlaub">Urlaub</button><button class="btn absence" data-a="sonderurlaub">Sonderurlaub</button></div>`);document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>period(b.dataset.a))}function health(){open('Gesundheit',`<div class="actions"><button class="btn health" data-h="kzh">KZH heute</button><button class="btn health" data-h="bwk">BWK heute</button><button class="btn health" data-h="krankenfahrt">Krankenfahrt</button></div>`);document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>b.dataset.h==='krankenfahrt'?kmform('krankenfahrt','Krankenfahrt'):add(b.dataset.h))}function period(def='urlaub'){let o=[['urlaub','Urlaub'],['sonderurlaub','Sonderurlaub'],['uebung','Übungsplatz'],['dienstreise','Dienstreise'],['sonder','Sonderdienst'],['kzh','KZH'],['bwk','BWK']];open('Zeitraum erfassen',`<div class="form"><div class="field"><label>Art</label><select id="pt">${o.map(([v,l])=>`<option value="${v}"${v===def?' selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Von</label><input id="pf" type="date" value="${iso(new Date())}"></div><div class="field"><label>Bis</label><input id="pto" type="date" value="${iso(new Date())}"></div><div class="field"><label>Bezeichnung / Ort</label><input id="pn"></div><button id="ps" class="btn dark">Speichern</button></div>`);$('ps').onclick=()=>add($('pt').value,$('pf').value,$('pto').value||$('pf').value,{title:$('pn').value.trim()})}document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>({drive,course,duty,absence,health,fvd:()=>add('fvd')}[b.dataset.q])());$('period').onclick=()=>period();$('close').onclick=close;$('sheetback').onclick=e=>{if(e.target===$('sheetback'))close()};$('signin').onclick=()=>signInWithPopup(auth,provider);$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{user=u;$('login').hidden=!!u;if(!u){if(unsub)unsub();return}if(unsub)unsub();unsub=onSnapshot(col(),s=>{E=[];s.forEach(d=>{if(d.id==='_journal'){let v=d.data();E=Array.isArray(v.entries)?v.entries:[];dist=+v.distance||75}});render()})});</script></body></html>
