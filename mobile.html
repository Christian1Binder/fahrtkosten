<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1219"><title>Dienstjournal mobil</title><style>:root{--bg:#0b1219;--panel:#17232d;--panel2:#21303c;--text:#eef2f5;--muted:#9cabb7;--line:#344552;--accent:#a6b47e;--warn:#d5b26b;--danger:#b76b6b}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#0a1118,#101b24);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,a{font:inherit}.app{max-width:760px;margin:auto;padding:14px 12px 42px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px}.head h1{margin:0;font-size:1.55rem}.date,.muted{color:var(--muted);font-size:.8rem}.headActions{display:flex;gap:7px}.btn,.iconbtn{border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);padding:11px 14px;font-weight:800;text-decoration:none;cursor:pointer}.iconbtn{min-width:50px}.primary{background:var(--accent);color:#111710;border-color:var(--accent)}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 10px 28px #0004}.today{margin-bottom:14px}.today h2{margin:0 0 9px;font-size:1rem}.todayList{display:grid;gap:7px}.todayItem{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:9px 10px;background:#111a22}.todayItem strong{font-size:.78rem}.todayItem small{color:var(--muted);font-size:.68rem;text-align:right}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick{min-height:114px;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--text);background:var(--panel);font-size:1rem;font-weight:850;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 20px #0003}.quick:active{background:var(--panel2)}.quick span{font-size:1.45rem}.quick small{font-size:.67rem;font-weight:650;color:var(--muted);line-height:1.25}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.bottom .btn{min-height:50px;display:grid;place-items:center;text-align:center}.sheetback{position:fixed;inset:0;background:#000b;display:grid;place-items:end center;padding:12px;z-index:40}.sheetback[hidden]{display:none}.sheet{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 14px 14px;padding:17px}.sheethead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.sheethead h2{margin:0;font-size:1.15rem}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions .btn{min-height:56px}.form{display:grid;gap:10px}.field{display:grid;gap:5px}.field label{font-size:.73rem;color:var(--muted);font-weight:750}.field input,.field select{width:100%;min-height:49px;border:1px solid var(--line);border-radius:11px;padding:10px;background:#101922;color:var(--text)}.warn{background:#342b1f;border:1px solid #6b5739;color:#f0d9ae;border-radius:13px;padding:12px;line-height:1.45}.warn ul{margin:7px 0 0;padding-left:19px}.login,.tour{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:18px;z-index:80}.login[hidden],.tour[hidden]{display:none}.box{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}.box h2{margin-top:0}.tourstep{min-height:180px}.tourdots{text-align:center;color:var(--muted);margin:12px}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;background:#05080b;color:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 15px;transition:.2s;z-index:90}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:390px){.quick{min-height:105px;padding:12px}.quick small{font-size:.62rem}.head h1{font-size:1.45rem}.btn,.iconbtn{padding:10px 12px}}</style></head><body><main class="app"><header class="head"><div><h1>Dienstjournal</h1><div id="date" class="date"></div></div><div class="headActions"><a href="help.html" class="iconbtn" aria-label="Hilfe">?</a><button id="logout" class="iconbtn">Abmelden</button></div></header><section class="card today"><h2>Heute erfasst</h2><div id="today" class="todayList"><span class="muted">Lädt …</span></div></section><section class="grid"><button class="quick" data-q="drive"><span>FAHRT</span>Heute gefahren<small>§ 6 Hin, Rück oder beides</small></button><button class="quick" data-q="course"><span>LG</span>Lehrgang<small>§ 3 Fahrt oder HomO</small></button><button class="quick" data-q="duty"><span>DST</span>Übung / Dienst<small>Übungsplatz, Dienstreise, Sonderdienst</small></button><button class="quick" data-q="absence"><span>ABW</span>Abwesenheit<small>Urlaub oder Sonderurlaub</small></button><button class="quick" data-q="health"><span>MED</span>Gesundheit<small>KZH, BWK oder Krankenfahrt</small></button><button class="quick" data-q="fvd"><span>FvD</span>FvD heute<small>Genommenen FvD eintragen</small></button></section><div class="bottom"><button id="period" class="btn">Zeitraum erfassen</button><a class="btn primary" href="calendar.html">Kalender & Auswertungen</a></div></main><div id="sheetback" class="sheetback" hidden><section class="sheet"><div class="sheethead"><h2 id="title">Schnellerfassung</h2><button id="close" class="btn">Schließen</button></div><div id="body"></div></section></div><div id="login" class="login"><div class="box"><h2>Dienstjournal öffnen</h2><p class="muted">Mit demselben Google-Konto anmelden wie in der Vollansicht.</p><button id="signin" class="btn primary" style="width:100%">Mit Google anmelden</button></div></div><div id="tour" class="tour" hidden><div class="box"><div id="tourstep" class="tourstep"></div><div id="tourdots" class="tourdots"></div><div style="display:flex;justify-content:space-between;gap:8px"><button id="tourSkip" class="btn">Überspringen</button><button id="tourNext" class="btn primary">Weiter</button></div></div></div><div id="toast" class="toast">Gespeichert</div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';import{initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,setDoc,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';const cfg={apiKey:'AIzaSyCmkI1PxYkj5yXJ2k-GBd4zwQ1Hw1K3H1w',authDomain:'bw-fahrtkostenapp.firebaseapp.com',projectId:'bw-fahrtkostenapp',storageBucket:'bw-fahrtkostenapp.firebasestorage.app',messagingSenderId:'806301754050',appId:'1:806301754050:web:c9c2531613c3927cae515b'},app=initializeApp(cfg),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}),provider=new GoogleAuthProvider(),$=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'),clean=o=>Object.fromEntries(Object.entries(o).filter(([,v])=>v!==undefined));provider.setCustomParameters({prompt:'select_account'});let user=null,E=[],dist=75,unsub=null;const jdoc=()=>doc(db,'users',user.uid,'days','_journal'),courses=()=>E.filter(e=>e.type==='lehrgang'),label=t=>({s6hin:'§ 6 Hinfahrt',s6rueck:'§ 6 Rückfahrt',s6beide:'§ 6 Hin & zurück',urlaub:'Urlaub',sonderurlaub:'Sonderurlaub',lehrgang:'Lehrgang § 3',fahrt:'§ 3 Fahrt',homo:'Lehrgang HomO',uebung:'Übungsplatz',dienstreise:'Dienstreise',sonder:'Sonderdienst',kzh:'KZH',bwk:'BWK',krankenfahrt:'Krankenfahrt',familienheimfahrt:'Familienheimfahrt',fvd:'FvD genommen'})[t]||t;function activeOn(e,date){if(!e||!e.from)return false;const to=e.to||e.from;if(date<e.from||date>to)return false;return !(Array.isArray(e.excludedDays)&&e.excludedDays.includes(date))}function overlaps(e,from,to){if(!e?.from)return false;const end=e.to||e.from;return !(end<from||e.from>to)}function toast(){const x=$('toast');x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}async function store(){await setDoc(jdoc(),{entries:E.map(clean),distance:dist,updatedAt:serverTimestamp()});toast()}function detail(e){const extras=[];if(e.title)extras.push(e.title);if(e.type==='fahrt'&&e.tripKind)extras.push({anreise:'Anreise',heimfahrt:'Heimfahrt',rueckreise:'Rückreise'}[e.tripKind]||e.tripKind);if(Number(e.km)>0)extras.push(`${Number(e.km).toLocaleString('de-DE')} km`);return extras.join(' · ')}function render(){const now=new Date(),today=iso(now);$('date').textContent=now.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});const entries=E.filter(e=>activeOn(e,today)).sort((a,b)=>String(a.type).localeCompare(String(b.type),'de'));$('today').innerHTML=entries.length?entries.map(e=>`<div class="todayItem"><strong>${esc(label(e.type))}</strong><small>${esc(detail(e)||'für heute eingetragen')}</small></div>`).join(''):'<span class="muted">Noch keine Einträge.</span>'}function open(title,html){$('title').textContent=title;$('body').innerHTML=html;$('sheetback').hidden=false}function close(){$('sheetback').hidden=true;$('body').innerHTML=''}async function add(type,from=iso(new Date()),to=from,x={}){if(!from)return;to=to||from;if(to<from){open('Datum prüfen','<div class="warn"><strong>Das Bis-Datum liegt vor dem Von-Datum.</strong></div>');return}const existing=E.filter(e=>overlaps(e,from,to));if(existing.length){const exact=existing.some(e=>e.type===type&&e.from===from&&(e.to||e.from)===to),items=existing.slice(0,10).map(e=>`<li>${esc(label(e.type))}${e.title?' · '+esc(e.title):''} (${esc(e.from)}${(e.to||e.from)!==e.from?'–'+esc(e.to):''})</li>`).join('');open(exact?'Möglicher Doppeleintrag':'Zeitraum bereits belegt',`<div class="warn"><strong>${exact?'Ein gleichartiger Eintrag besteht bereits.':'Im gewählten Zeitraum bestehen bereits Einträge.'}</strong><ul>${items}</ul></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px"><button id="cancelDup" class="btn">Abbrechen</button><button id="saveDup" class="btn primary">Trotzdem speichern</button></div>`);$('cancelDup').onclick=close;$('saveDup').onclick=()=>commitAdd(type,from,to,x);return}await commitAdd(type,from,to,x)}async function commitAdd(type,from,to,x){E.push(clean({id:Date.now(),type,from,to,title:x.title||'',km:x.km,courseId:x.courseId,tripKind:x.tripKind,note:'',dayTypes:type==='uebung'?{}:undefined}));await store();render();close()}function drive(){open('Heute gefahren',`<div class="actions"><button class="btn" data-d="s6beide">Hin & zurück</button><button class="btn" data-d="s6hin">Nur Hinfahrt</button><button class="btn" data-d="s6rueck">Nur Rückfahrt</button><button class="btn" data-d="familienheimfahrt">Familienheimfahrt</button></div>`);document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const t=b.dataset.d;if(t==='familienheimfahrt')return kmform(t,'Familienheimfahrt');add(t,undefined,undefined,{km:dist*(t==='s6beide'?2:1)})})}function kmform(type,title){open(title,`<div class="form"><div class="field"><label>Kilometer</label><input id="km" type="number" min="0" step="0.1"></div><button id="kms" class="btn primary">Heute speichern</button></div>`);$('kms').onclick=()=>add(type,undefined,undefined,{km:+$('km').value||0})}function course(){const c=courses();if(!c.length){open('Lehrgang','<p class="muted">Noch kein Lehrgang angelegt. Bitte zunächst in der Kalenderansicht einen Lehrgang anlegen.</p><a class="btn primary" style="display:block;text-align:center" href="calendar.html">Kalender öffnen</a>');return}open('Lehrgang heute',`<div class="form"><div class="field"><label>Lehrgang</label><select id="c">${c.map(x=>`<option value="${x.id}">${esc(x.title||'Lehrgang')}</option>`).join('')}</select></div><div class="actions"><button class="btn" data-c="anreise">Anreise</button><button class="btn" data-c="heimfahrt">Heimfahrt</button><button class="btn" data-c="rueckreise">Rückreise</button><button class="btn" data-c="homo">HomO heute</button></div></div>`);document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const x=c.find(z=>String(z.id)===String($('c').value)),k=b.dataset.c;if(k==='homo')add('homo',undefined,undefined,{courseId:x.id,title:x.title});else add('fahrt',undefined,undefined,{courseId:x.id,tripKind:k,km:(+x.distance||0)*(k==='heimfahrt'?2:1),title:x.title})})}function duty(){open('Übung / Dienst',`<div class="actions"><button class="btn" data-x="uebung">Übungsplatz</button><button class="btn" data-x="dienstreise">Dienstreise</button><button class="btn" data-x="sonder">Sonderdienst heute</button><button id="dp" class="btn">Zeitraum</button></div>`);document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>b.dataset.x==='sonder'?add('sonder'):period(b.dataset.x));$('dp').onclick=()=>period('uebung')}function absence(){open('Abwesenheit',`<div class="actions"><button class="btn" data-a="urlaub">Urlaub</button><button class="btn" data-a="sonderurlaub">Sonderurlaub</button></div>`);document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>period(b.dataset.a))}function health(){open('Gesundheit',`<div class="actions"><button class="btn" data-h="kzh">KZH heute</button><button class="btn" data-h="bwk">BWK heute</button><button class="btn" data-h="krankenfahrt">Krankenfahrt</button></div>`);document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>b.dataset.h==='krankenfahrt'?kmform('krankenfahrt','Krankenfahrt'):add(b.dataset.h))}function period(def='urlaub'){const options=[['urlaub','Urlaub'],['sonderurlaub','Sonderurlaub'],['uebung','Übungsplatz'],['dienstreise','Dienstreise'],['sonder','Sonderdienst'],['kzh','KZH'],['bwk','BWK']];const today=iso(new Date());open('Zeitraum erfassen',`<div class="form"><div class="field"><label>Art</label><select id="pt">${options.map(([v,l])=>`<option value="${v}"${v===def?' selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Von</label><input id="pf" type="date" value="${today}"></div><div class="field"><label>Bis</label><input id="pto" type="date" value="${today}"></div><div class="field"><label>Bezeichnung / Ort</label><input id="pn"></div><button id="ps" class="btn primary">Speichern</button></div>`);$('ps').onclick=()=>add($('pt').value,$('pf').value,$('pto').value||$('pf').value,{title:$('pn').value.trim()})}document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>({drive,course,duty,absence,health,fvd:()=>add('fvd')}[b.dataset.q])());$('period').onclick=()=>period();$('close').onclick=close;$('sheetback').onclick=e=>{if(e.target===$('sheetback'))close()};$('signin').onclick=()=>signInWithPopup(auth,provider);$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{user=u;$('login').hidden=!!u;if(unsub){unsub();unsub=null}if(!u){E=[];render();return}unsub=onSnapshot(jdoc(),s=>{const d=s.data()||{};E=Array.isArray(d.entries)?d.entries:[];dist=Number(d.distance)||75;render()},err=>{console.error(err);$('today').innerHTML='<span class="muted">Daten konnten nicht geladen werden.</span>'})});const steps=[['Schnellerfassung','Die großen Schaltflächen erfassen die häufigsten Vorgänge mit wenigen Berührungen.'],['Doppelbelegungen','Vor dem Speichern prüft die App den gewählten Tag oder Zeitraum und warnt bei vorhandenen Einträgen.'],['Zeiträume','Urlaub, Übungsplatz, Dienstreise und Krankheit können über „Zeitraum erfassen“ für mehrere Tage angelegt werden.'],['Kalender & Auswertungen','Die vollständige Verwaltung öffnet sich separat. Über die obere Leiste gelangst du jederzeit zurück.'],['Hilfe','Das Fragezeichen oben öffnet die vollständige Informationsseite.']];let si=0;function showTour(){const[s,t]=steps[si];$('tourstep').innerHTML=`<h2>${s}</h2><p class="muted" style="font-size:1rem;line-height:1.55">${t}</p>`;$('tourdots').textContent=`${si+1} / ${steps.length}`;$('tourNext').textContent=si===steps.length-1?'Fertig':'Weiter'}function endTour(){localStorage.setItem('dienstjournalTour','1');$('tour').hidden=true}$('tourNext').onclick=()=>{if(si===steps.length-1)return endTour();si++;showTour()};$('tourSkip').onclick=endTour;if(!localStorage.getItem('dienstjournalTour')){$('tour').hidden=false;showTour()}</script></body></html>
